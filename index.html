<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUST Hotel Booking Web System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#0f172a'
            }
          }
        }
      }
    };
  </script>
  <style>
    ::selection { background-color: #dbeafe; color: #1e3a8a; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @media print {
      body * { visibility: hidden !important; }
      #printable-voucher, #printable-voucher * { visibility: visible !important; }
      #printable-voucher {
        position: fixed !important;
        left: 0; top: 0; width: 100%;
        border: none !important;
        box-shadow: none !important;
        padding: 24px !important;
        background: #ffffff !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>

            <path stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M4 21V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14M9 9h2m2 0h2m-6 4h2m2 0h2m-4 8v-4h2v4" />

        <div class="min-w-0">

        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        <!-- VI / EN Language Toggle (NFR-06) -->
        <div class="inline-flex rounded-lg bg-slate-800 p-0.5 border border-slate-700" role="group" aria-label="Language toggle">
          <button id="btn-lang-vi" type="button" onclick="setLang('vi')" class="px-2.5 py-1 text-xs font-medium rounded-md transition-colors">VI</button>
          <button id="btn-lang-en" type="button" onclick="setLang('en')" class="px-2.5 py-1 text-xs font-medium rounded-md transition-colors">EN</button>
        </div>

        <!-- Quick Role Switcher (NFR-03) -->
        <div class="flex items-center gap-1.5">
          <label for="role-switcher" id="lbl-role" class="text-xs text-slate-400 hidden md:inline">Role:</label>
          <select id="role-switcher" onchange="setRole(this.value)" class="bg-slate-800 text-slate-100 text-xs font-medium border border-slate-700 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="guest">Guest</option>
            <option value="agent">Travel Agent</option>
            <option value="staff">Reservation Staff</option>
            <option value="receptionist">Receptionist</option>
            <option value="manager">Manager</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <!-- Reset Demo Data -->
        <button id="btn-reset-demo" type="button" onclick="resetDemoData()" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 0 0 4.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 0 1-15.357-2m15.357 2H15" />
          </svg>
          <span id="txt-reset-demo" class="hidden sm:inline">Reset Demo Data</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace Layout -->
  <div class="max-w-[1440px] w-full mx-auto flex-1 flex flex-col lg:flex-row">
    <!-- Role-Adaptive Sidebar Navigation -->
    <aside class="lg:w-64 shrink-0 bg-white border-b lg:border-b-0 lg:border-r border-slate-200 p-3 sm:p-4">
      <div id="role-context-card" class="mb-3 p-3 rounded-xl bg-slate-50 border border-slate-200"></div>
      <nav id="main-nav" class="flex lg:flex-col gap-1.5 overflow-x-auto pb-1 lg:pb-0" aria-label="Primary modules"></nav>
      <div id="scope-note" class="hidden lg:block mt-5 pt-4 border-t border-slate-200 text-xs text-slate-500 space-y-1.5"></div>
    </aside>

    <!-- Primary Content Area -->
    <main id="app-content" class="flex-1 p-4 sm:p-6 min-w-0"></main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <div id="modal-root" class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-900/50 p-4 overflow-y-auto" role="dialog" aria-modal="true">
    <div id="modal-panel" class="bg-white rounded-xl border border-slate-200 shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto"></div>

    // =========================================================================

    // =========================================================================
    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function t(path, vars = {}) {
      const parts = path.split('.');
      let cur = I18N[ui.lang];
      for (const p of parts) {
        cur = cur && cur[p] !== undefined ? cur[p] : undefined;
      }
      if (typeof cur !== 'string') return cur !== undefined ? cur : path;
      return cur.replace(/\{(\w+)\}/g, (_, k) => (vars[k] !== undefined ? vars[k] : `{${k}}`));
    }

    function formatVND(num) {
      return Number(num || 0).toLocaleString(ui.lang === 'vi' ? 'vi-VN' : 'en-US') + ' ₫';
    }

    function nowStamp() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function addDays(dateStr, days) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d + Number(days)));
      return dt.toISOString().slice(0, 10);
    }

    function getDatesBetween(checkIn, nights) {
      const list = [];
      const count = Math.max(1, Number(nights) || 1);
      for (let i = 0; i < count; i++) list.push(addDays(checkIn, i));
      return list;
    }

    function maskCardNumber(raw) {
      const digits = String(raw || '').replace(/\D/g, '');
      if (digits.length >= 4) return `****-${digits.slice(-4)}`;
      if (String(raw || '').includes('****-')) return String(raw).trim();
      return '****-0000';
    }

    function isBookingActiveStatus(status) {
      return status === 'Confirmed' || status === 'Pending Reconfirm' || status === 'Modified';
    }

    function getDefaultNightlyStats(roomTypeId, dateStr, total) {
      // Deterministic baseline outside 11-12..14 so Nov density grid works realistically for all 30 days
      const dayNum = Number(dateStr.slice(8, 10)) || 15;
      const occRatio = dayNum % 7 === 5 || dayNum % 7 === 6 ? 0.58 : 0.42;
      const occupied = Math.floor(total * occRatio);
      const otherBooked = Math.floor(total * 0.12);
      return { occupied, otherBooked, uncertain: dayNum % 3 === 0 ? 2 : 1, cancelled: 0, earlyCheckout: 0 };
    }

    function calculateNightAvailability(targetState, roomTypeId, dateStr, excludeBookingNo = null) {
      const rt = targetState.roomTypes.find(r => r.id === roomTypeId) || targetState.roomTypes[0];
      const ledger = (targetState.nightlyLedger[rt.id] && targetState.nightlyLedger[rt.id][dateStr])
        || getDefaultNightlyStats(rt.id, dateStr, rt.total);

      // Sum active bookings covering this night
      let activeBookingsQty = 0;
      for (const b of targetState.bookings) {
        if (excludeBookingNo && b.bookingNo === excludeBookingNo) continue;
        if (b.roomType !== rt.id || !isBookingActiveStatus(b.status)) continue;
        const bEnd = addDays(b.checkIn, b.nights);
        if (dateStr >= b.checkIn && dateStr < bEnd) {
          activeBookingsQty += Number(b.qty);
        }
      }

      // Active agent allotment quota reserved (BR-09)
      let allotmentQty = 0;
      for (const ag of targetState.agents) {
        if (ag.status === 'Active' && ag.contractType === 'Allotment' && ag.roomType === rt.id) {
          allotmentQty += Number(ag.quota || 0);
        }
      }

      const total = Number(rt.total);
      const outOfOrder = Number(rt.outOfOrder);
      const occupied = Number(ledger.occupied);
      const booked = Number(ledger.otherBooked) + activeBookingsQty + allotmentQty;
      const T = total - outOfOrder - occupied - booked;

      const uncertain = Number(ledger.uncertain || 0);
      const cancelled = Number(ledger.cancelled || 0);
      const earlyCheckout = Number(ledger.earlyCheckout || 0);
      const D = uncertain + cancelled + earlyCheckout;

      const cap = Math.floor((Number(targetState.policies.overbookingRate) / 100) * total);
      const effectiveOverbook = Math.min(D, cap);
      const sellable = T + effectiveOverbook;

      return {
        date: dateStr,
        roomType: rt.id,
        total,
        outOfOrder,
        occupied,
        booked,
        activeBookingsQty,
        allotmentQty,
        T,
        uncertain,
        cancelled,
        earlyCheckout,
        D,
        cap,
        sellable
      };
    }

    function checkAvailabilityRange(targetState, roomTypeId, checkIn, nights, qty, excludeBookingNo = null) {
      const dates = getDatesBetween(checkIn, nights);
      const breakdown = dates.map(d => {
        const info = calculateNightAvailability(targetState, roomTypeId, d, excludeBookingNo);
        const shortfall = Math.max(0, Number(qty) - info.sellable);
        return { ...info, requested: Number(qty), sufficient: info.sellable >= Number(qty), shortfall };
      });
      const available = breakdown.every(n => n.sufficient);
      const minSellable = Math.min(...breakdown.map(n => n.sellable));
      const maxShortfall = Math.max(...breakdown.map(n => n.shortfall));
      return { available, minSellable, maxShortfall, breakdown };
    }

    function checkBlacklist(targetState, { name, phone, email }) {
      const n = String(name || '').trim().toLowerCase();
      const p = String(phone || '').replace(/\s+/g, '');
      const e = String(email || '').trim().toLowerCase();
      return targetState.blacklist.find(entry => {
        const en = entry.name.trim().toLowerCase();
        const ep = entry.phone.replace(/\s+/g, '');
        const ee = entry.email.trim().toLowerCase();
        return (n && n === en) || (p && p === ep) || (e && e === ee);
      }) || null;
    }

    function nextBookingNo() {
      let maxSeq = 6;
      for (const b of state.bookings) {
        const m = String(b.bookingNo).match(/BK-2026-(\d+)/);

      }
      return `BK-2026-${String(maxSeq + 1).padStart(4, '0')}`;
    }

    // Async Promise Mutex Lock for transactional booking & SC-02 concurrency test (NFR-02)
    class AsyncMutex {
      constructor() { this.queue = Promise.resolve(); }
      runExclusive(task) {
        const next = this.queue.then(() => task(), () => task());
        this.queue = next.catch(() => {});
        return next;
      }
    }
    const bookingMutex = new AsyncMutex();

    async function submitBooking(forceStaffOverride = false) {
      syncDraftInputs();
      const d = ui.bookingDraft;
      if (!d.guestName.trim() || !d.phone.trim() || !d.email.trim()) {
        showToast(ui.lang === 'vi' ? 'Vui lòng điền đầy đủ Tên khách, SĐT và Email (FR-02).' : 'Please complete required guest Name, Phone, and Email (FR-02).', 'error');
        return;
      }

      const blMatch = checkBlacklist(state, { name: d.guestName, phone: d.phone, email: d.email });
      if (blMatch && !forceStaffOverride) {
        showToast(ui.lang === 'vi' ? 'Khách thuộc danh sách đen! Không thể tự đặt (BR-08).' : 'Guest is blacklisted! Self-booking blocked (BR-08).', 'error');
        render();
        return;
      }

      await bookingMutex.runExclusive(async () => {
        // Re-verify Step 2 availability inside transaction lock (NFR-02)
        const recheck = checkAvailabilityRange(state, ui.search.roomType, ui.search.checkIn, ui.search.nights, ui.search.qty);
        if (!recheck.available) {
          showToast(ui.lang === 'vi' ? 'Phòng vừa hết trong khi xử lý giao dịch! Vui lòng kiểm tra lại.' : 'Availability changed concurrently. Please re-check Step 2.', 'error');
          ui.availabilityCheck = recheck;
          ui.wizardStep = 2;
          render();
          return;
        }

        // Check Free Sale contract status if Agent Free Sale
        if (ui.search.source === 'Agent Free Sale') {
          const fs = state.agents.find(a => a.contractType === 'Free Sale');
          if (fs && fs.status !== 'Active') {
            showToast(ui.lang === 'vi' ? 'Hợp đồng Free Sale hiện đã bị tạm ngừng bởi quản lý (BR-09).' : 'Free Sale contract is currently Stopped by manager (BR-09).', 'error');
            return;
          }
        }

        const rt = state.roomTypes.find(r => r.id === ui.search.roomType);
        const tierObj = I18N.en.booking.tiers.find(x => x.id === d.rateTier) || I18N.en.booking.tiers[0];
        const unitPrice = Math.round(rt.basePrice * tierObj.mult);
        const totalAmount = unitPrice * ui.search.qty * ui.search.nights;
        const bookingNo = nextBookingNo();
        const leadDays = d.guestType === 'Group' ? state.policies.reconfirmDaysGroup : state.policies.reconfirmDaysIndiv;
        const reconfirmDeadline = addDays(ui.search.checkIn, -leadDays);
        const isGuaranteed = d.reservationType === 'Guaranteed';
        const cardMasked = (isGuaranteed && d.guaranteeMethod === 'Credit Card') ? maskCardNumber(d.cardInput) : '';

        const newBooking = {
          bookingNo,
          guestName: d.guestName.trim(),
          registrantName: (d.registrantName || d.guestName).trim(),
          guestType: d.guestType,
          phone: d.phone.trim(),
          email: d.email.trim(),
          address: d.address.trim() || 'N/A',
          paymentUnit: d.paymentUnit.trim() || (d.guestType === 'Group' ? d.guestName.trim() : 'Individual'),
          roomType: ui.search.roomType,
          qty: ui.search.qty,
          numGuests: ui.search.guests,
          checkIn: ui.search.checkIn,
          nights: ui.search.nights,
          checkOut: addDays(ui.search.checkIn, ui.search.nights),
          rateTier: d.rateTier,
          unitPrice,
          totalAmount,
          source: ui.search.source,
          reservationType: d.reservationType,
          guaranteeMethod: isGuaranteed ? d.guaranteeMethod : 'None',
          cardMasked,
          depositAmount: isGuaranteed ? (d.depositAmount || 0) : 0,
          specialRequest: d.specialRequest.trim(),
          status: 'Confirmed',
          reconfirmed: false,
          reconfirmDeadline,
          createdAt: nowStamp(),
          createdBy: t(`roles.${ui.role}`),
          history: [
            {
              action: 'Created',
              detail: `${ui.search.qty} ${ui.search.roomType} (${ui.search.checkIn} · ${ui.search.nights}n), ${d.reservationType}${cardMasked ? ' ' + cardMasked : ''}`,
              requestedBy: d.guestName.trim(),
              staff: t(`roles.${ui.role}`),
              at: nowStamp()
            }
          ]
        };

        state.bookings.unshift(newBooking);
        addAuditLog(t(`roles.${ui.role}`), 'BOOKING_CREATE', `${bookingNo}: ${newBooking.guestName}, ${newBooking.qty} ${newBooking.roomType}`);
        saveState();

        ui.wizardStep = 5;
        ui.availabilityCheck = checkAvailabilityRange(state, ui.search.roomType, ui.search.checkIn, ui.search.nights, ui.search.qty);
        render();
        openEmailVoucherModal(bookingNo);
      });
    }

    function simulate1800Cutoff() {
      const targetDate = ui.staffFilter.date || '2026-11-12';
      let releasedCount = 0;
      let freedRooms = 0;
      const releasedNos = [];

      for (const b of state.bookings) {
        if (b.checkIn === targetDate && b.reservationType === 'Non-guaranteed' && isBookingActiveStatus(b.status)) {
          b.status = 'Expired (18:00 Cutoff)';
          b.history.push({
            action: 'Auto-Released (18:00)',
            detail: `Non-guaranteed hold expired at ${state.policies.holdUntilTime} cutoff (FR-18 / BR-02). ${b.qty} ${b.roomType} returned to sellable inventory.`,
            requestedBy: 'System Timer',
            staff: 'Auto Scheduler',
            at: nowStamp()
          });
          releasedCount++;
          freedRooms += Number(b.qty);
          releasedNos.push(`${b.bookingNo} (${b.qty} ${b.roomType})`);
        }
      }

      if (releasedCount === 0) {
        showToast(ui.lang === 'vi'
          ? `Không có đơn Không đảm bảo nào đến hạn ${state.policies.holdUntilTime} ngày ${targetDate}.`
          : `No active non-guaranteed bookings expiring at ${state.policies.holdUntilTime} on ${targetDate}.`, 'info');
        return;
      }

      addAuditLog('System Timer', 'CUTOFF_1800', `Released ${releasedCount} non-guaranteed bookings (${freedRooms} rooms) on ${targetDate}: ${releasedNos.join(', ')}`);
      saveState();
      if (ui.availabilityCheck) runStep2Check(false);
      render();

      // Check matching waitlist guests (BR-07)
      const matchingWL = state.waitlist.filter(w => w.status === 'Waiting' && w.checkIn === targetDate);
      if (matchingWL.length > 0) {
        showToast(ui.lang === 'vi'
          ? `Đã giải phóng ${freedRooms} phòng! Có ${matchingWL.length} khách chờ phù hợp cần liên hệ ưu tiên (BR-07).`
          : `Released ${freedRooms} rooms! ${matchingWL.length} Waitlist guest(s) match ${targetDate} (BR-07).`, 'success');
      } else {
        showToast(ui.lang === 'vi'
          ? `Đã tự động giải phóng ${releasedCount} phiếu (${freedRooms} phòng).`
          : `Auto-released ${releasedCount} booking(s) (${freedRooms} rooms).`, 'success');
      }
    }

    function sendReconfirmReminders() {

    function confirmModifyBooking(bookingNo) {
      const b = state.bookings.find(x => x.bookingNo === bookingNo);
      if (!b) return;
      const newCheckIn = document.getElementById('mod-checkin').value;
      const newNights = Math.max(1, Number(document.getElementById('mod-nights').value) || 1);
      const newRoomType = document.getElementById('mod-roomtype').value;
      const newQty = Math.max(1, Number(document.getElementById('mod-qty').value) || 1);
      const newResType = document.getElementById('mod-restype').value;
      const reqBy = document.getElementById('mod-reqby').value.trim() || b.guestName;

      // Exclude current booking when re-running Step 2 availability check (FR-15)
      const check = checkAvailabilityRange(state, newRoomType, newCheckIn, newNights, newQty, bookingNo);
      const fb = document.getElementById('mod-check-feedback');
      if (!check.available) {
        const shortNights = check.breakdown.filter(n => !n.sufficient).map(n => `${n.date}: sellable ${n.sellable} < ${newQty}`).join(' · ');
        fb.innerHTML = `<div class="p-3 rounded-lg bg-red-50 border border-red-200 text-xs text-red-800">
          <strong>${ui.lang === 'vi' ? 'Không đủ phòng theo công thức Bước 2:' : 'Step 2 Availability Failed:'}</strong> ${esc(shortNights)}
        </div>`;
        return;
      }

      const oldDesc = `${b.qty} ${b.roomType} (${b.checkIn}, ${b.nights}n, ${b.reservationType})`;
      const rt = state.roomTypes.find(r => r.id === newRoomType);
      const tierObj = I18N.en.booking.tiers.find(x => x.id === b.rateTier) || I18N.en.booking.tiers[0];

      b.checkIn = newCheckIn;
      b.nights = newNights;
      b.checkOut = addDays(newCheckIn, newNights);
      b.roomType = newRoomType;
      b.qty = newQty;
      b.reservationType = newResType;
      if (newResType === 'Non-guaranteed') b.guaranteeMethod = 'None';
      else if (b.guaranteeMethod === 'None') b.guaranteeMethod = 'Deposit';
      b.unitPrice = Math.round(rt.basePrice * tierObj.mult);
      b.totalAmount = b.unitPrice * newQty * newNights;
      b.status = 'Modified';

      const newDesc = `${newQty} ${newRoomType} (${newCheckIn}, ${newNights}n, ${newResType})`;
      b.history.push({
        action: 'Modified',
        detail: `${oldDesc} → ${newDesc} [Step 2 min sellable: ${check.minSellable}]`,
        requestedBy: reqBy,
        staff: t(`roles.${ui.role}`),

    function confirmCancelBooking(bookingNo, feeAmount) {
      const b = state.bookings.find(x => x.bookingNo === bookingNo);
      if (!b) return;
      const reason = document.getElementById('cancel-reason').value.trim() || 'Guest request';
      const reqBy = document.getElementById('cancel-reqby').value.trim() || b.guestName;

      b.status = 'Cancelled';
      b.history.push({
        action: 'Cancelled',
        detail: `Reason: ${reason}. Cancellation fee: ${formatVND(feeAmount)} (BR-10). Freed ${b.qty} ${b.roomType}.`,
        requestedBy: reqBy,
        staff: t(`roles.${ui.role}`),
        at: nowStamp()
      });
      addAuditLog(t(`roles.${ui.role}`), 'BOOKING_CANCEL', `${bookingNo} cancelled (${b.qty} ${b.roomType}); fee ${formatVND(feeAmount)}`);

      // Priority waitlist matching check (BR-07)
      const matches = state.waitlist.filter(w => w.status === 'Waiting' && w.roomType === b.roomType && w.checkIn === b.checkIn);
      matches.forEach(w => {
        const av = checkAvailabilityRange(state, w.roomType, w.checkIn, w.nights, w.qty);
        if (av.available) w.status = 'Notified';
      });

      saveState();
      closeModal();
      if (ui.availabilityCheck) runStep2Check(false);
      render();

      if (matches.length > 0) {
        showToast(ui.lang === 'vi'
          ? `Đã hủy ${bookingNo}. Có ${matches.length} khách chờ phù hợp (${matches.map(m => m.guestName).join(', ')}) — ưu tiên liên hệ ngay!`
          : `Cancelled ${bookingNo}. ${matches.length} Waitlist match(es) highlighted for priority contact (BR-07)!`, 'success');
      } else {
        showToast(`${bookingNo} ${ui.lang === 'vi' ? 'đã được hủy và giải phóng phòng.' : 'cancelled & rooms released.'}`, 'info');
      }
    }

      const av = checkAvailabilityRange(state, w.roomType, w.checkIn, w.nights, w.qty);
      if (!av.available) {
        showToast(ui.lang === 'vi'
          ? `Hiện vẫn chưa đủ ${w.qty} phòng ${w.roomType} cho ${w.guestName} (cần giải phóng thêm).`

    function logReceptionEvent(type, bookingNo = null) {
      const dateStr = ui.receptionDate;
      if (!state.receptionMetrics[dateStr]) {
        state.receptionMetrics[dateStr] = { walkins: 0, earlyCheckouts: 0, overstays: 0 };
      }
      if (type === 'walkin') {
        state.receptionMetrics[dateStr].walkins++;
        addAuditLog(t(`roles.${ui.role}`), 'RECEPTION_WALKIN', `Logged 1 walk-in guest on ${dateStr}`);
      } else if (type === 'early') {
        state.receptionMetrics[dateStr].earlyCheckouts++;
        if (state.nightlyLedger.Standard[dateStr]) {
          state.nightlyLedger.Standard[dateStr].earlyCheckout++;
        }
        addAuditLog(t(`roles.${ui.role}`), 'RECEPTION_EARLY_CHECKOUT', `Logged early check-out on ${dateStr} (+1 adjustment in Step 2 formula)`);
      } else if (type === 'overstay') {
        state.receptionMetrics[dateStr].overstays++;
        addAuditLog(t(`roles.${ui.role}`), 'RECEPTION_OVERSTAY', `Logged overstay guest on ${dateStr}`);
      } else if (type === 'noshow' && bookingNo) {
        const b = state.bookings.find(x => x.bookingNo === bookingNo);
        if (b && isBookingActiveStatus(b.status)) {
          b.status = 'No-Show';

    // SC-02 Concurrency Integrity Test (50 simultaneous requests through AsyncMutex)
    async function runConcurrencyTest50() {
      if (ui.sc02Running) return;
      ui.sc02Running = true;
      render();

      const targetDate = '2026-11-14';
      const targetRoomType = 'Standard';
      const initialAvail = calculateNightAvailability(state, targetRoomType, targetDate);
      const initialSellable = Math.max(0, initialAvail.sellable);

      // Cloned sandbox state so 50 synthetic bookings prove transactional safety without cluttering main demo bookings
      const testState = JSON.parse(JSON.stringify(state));
      const testLock = new AsyncMutex();
      const t0 = performance.now();

      const requests = Array.from({ length: 50 }, (_, idx) => {
        const reqNum = idx + 1;
        return testLock.runExclusive(async () => {
          // Simulate tiny microtask yield to stress concurrent ordering
          await Promise.resolve();
          const check = checkAvailabilityRange(testState, targetRoomType, targetDate, 1, 1);
          if (check.available) {
            testState.bookings.push({
              bookingNo: `CONC-${reqNum}`,
              roomType: targetRoomType,
              qty: 1,
              checkIn: targetDate,
              nights: 1,
              status: 'Confirmed'
            });
            return { reqNum, accepted: true, remainingAfter: check.minSellable - 1 };
          }
          return { reqNum, accepted: false, remainingAfter: check.minSellable };
        });
      });

      const outcomes = await Promise.all(requests);
      const elapsedMs = Math.round((performance.now() - t0) * 100) / 100;
      const acceptedCount = outcomes.filter(o => o.accepted).length;
      const rejectedCount = outcomes.filter(o => !o.accepted).length;
      const finalAvail = calculateNightAvailability(testState, targetRoomType, targetDate);
      const oversold = finalAvail.sellable < 0 || acceptedCount > initialSellable;

      ui.sc02Result = {
        targetDate,
        targetRoomType,
        initialSellable,
        acceptedCount,
        rejectedCount,
        finalSellable: finalAvail.sellable,
        oversold,
        elapsedMs,
        passed: !oversold && acceptedCount === initialSellable && elapsedMs <= 3000,
        outcomes
      };
      ui.sc02Running = false;
      addAuditLog('System Verification', 'SC02_CONCURRENCY', `50 concurrent requests on ${targetDate} ${targetRoomType}: ${acceptedCount} accepted, ${rejectedCount} rejected, 0 oversold (${elapsedMs} ms)`);
      saveState();
      render();
    }

    function showToast(message, type = 'info') {

        info: 'bg-slate-900 text-white border-slate-700'
      };

      el.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-lg text-xs font-medium ${colors[type] || colors.info}`;

    function renderManagerConsole() {
      const isVi = ui.lang === 'vi';
      const p = state.policies;
      const densityRt = ui.densityRoomType;

      // 30-day November 2026 density heatmap (FR-13)
      const densityCells = Array.from({ length: 30 }, (_, idx) => {
        const day = idx + 1;
        const dateStr = `2026-11-${String(day).padStart(2, '0')}`;
        const info = calculateNightAvailability(state, densityRt, dateStr);
        const committed = info.occupied + info.booked + info.outOfOrder;
        const pct = Math.min(115, Math.round((committed / Math.max(1, info.total)) * 100));
        const colorCls = pct >= 95 ? 'bg-red-50 border-red-300 text-red-900'
          : pct >= 70 ? 'bg-amber-50 border-amber-300 text-amber-900'
          : 'bg-emerald-50 border-emerald-200 text-emerald-900';
        const isTable9Focus = day >= 12 && day <= 14 && densityRt === 'Standard';
        return `
          <div class="p-2 rounded-lg border text-xs tabular-nums ${colorCls} ${isTable9Focus ? 'ring-2 ring-blue-500' : ''}"
               title="${dateStr}: Occ=${info.occupied}, Booked=${info.booked}, T=${info.T}, Sellable=${info.sellable}">
            <div class="flex items-center justify-between font-semibold">
              <span>${day}/11</span>
              <span>${pct}%</span>
            </div>
            <div class="text-[11px] opacity-80 mt-0.5">${isVi ? 'Bán:' : 'Sell:'} ${info.sellable}</div>
          </div>
        `;
      }).join('');

      // Inventory editor rows
      const invRows = state.roomTypes.map(rt => `
        <tr class="border-t border-slate-200 text-xs sm:text-sm">
          <td class="px-3 py-2.5 font-semibold text-slate-900">${esc(rt.name)}</td>
          <td class="px-3 py-2.5"><input id="inv-total-${esc(rt.id)}" type="number" min="1" value="${rt.total}" class="w-20 rounded border border-slate-300 px-2 py-1 text-sm tabular-nums" /></td>
          <td class="px-3 py-2.5"><input id="inv-ooo-${esc(rt.id)}" type="number" min="0" value="${rt.outOfOrder}" class="w-20 rounded border border-slate-300 px-2 py-1 text-sm tabular-nums" /></td>
          <td class="px-3 py-2.5"><input id="inv-price-${esc(rt.id)}" type="number" step="100000" value="${rt.basePrice}" class="w-32 rounded border border-slate-300 px-2 py-1 text-sm tabular-nums" /></td>
        </tr>
      `).join('');

      // SC-02 result display
      const sc = ui.sc02Result;
      const scHtml = sc ? `
        <div class="mt-4 p-4 rounded-xl border ${sc.passed ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'} space-y-2 text-xs">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <span class="font-bold text-sm ${sc.passed ? 'text-emerald-900' : 'text-red-900'}">
              ${sc.passed ? (isVi ? 'ĐẠT SC-02 & NFR-01: 0 phòng bị đặt vượt!' : 'SC-02 & NFR-01 PASSED: Zero Overbooking!') : 'SC-02 FAILED'}
            </span>
            <span class="font-mono text-slate-700">${sc.elapsedMs} ms (≤ 3000 ms)</span>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 tabular-nums">
            <div class="bg-white/80 p-2 rounded border border-slate-200">${isVi ? 'Bán được ban đầu:' : 'Initial Sellable:'} <strong>${sc.initialSellable}</strong></div>
            <div class="bg-white/80 p-2 rounded border border-slate-200">${isVi ? 'Được chấp nhận:' : 'Accepted:'} <strong class="text-emerald-700">${sc.acceptedCount}</strong></div>
            <div class="bg-white/80 p-2 rounded border border-slate-200">${isVi ? 'Bị từ chối:' : 'Rejected:'} <strong class="text-amber-700">${sc.rejectedCount}</strong></div>
            <div class="bg-white/80 p-2 rounded border border-slate-200">${isVi ? 'Còn lại cuối:' : 'Remaining:'} <strong>${sc.finalSellable}</strong></div>
          </div>
          <div class="flex flex-wrap gap-1 pt-1">
            ${sc.outcomes.map(o => `<span class="px-1.5 py-0.5 rounded text-[10px] font-mono ${o.accepted ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-600'}">#${o.reqNum}:${o.accepted ? 'OK' : 'FULL'}</span>`).join('')}
          </div>
        </div>
      ` : '';

      return `
        <div class="mb-4">
          <h2 class="text-lg sm:text-xl font-bold text-slate-900">${esc(t('manager.heading'))}</h2>
          <p class="text-xs sm:text-sm text-slate-500 mt-0.5">${esc(t('manager.sub'))}</p>
        </div>

        <!-- Monthly Density Heatmap (FR-13) -->
        <section class="bg-white rounded-xl border border-slate-200 p-4 sm:p-5 mb-5">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <h3 class="text-sm font-semibold text-slate-900">${esc(t('manager.densityTitle'))}</h3>
            <select onchange="ui.densityRoomType=this.value; render();" class="rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-medium">
              ${state.roomTypes.map(r => `<option value="${esc(r.id)}" ${densityRt === r.id ? 'selected' : ''}>${esc(r.name)} (${r.total} rooms)</option>`).join('')}
            </select>
          </div>
          <div class="grid grid-cols-3 sm:grid-cols-6 lg:grid-cols-10 gap-2">${densityCells}</div>
        </section>

        <!-- Inventory & Policies -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-5">
          <section class="bg-white rounded-xl border border-slate-200 p-4 sm:p-5">
            <h3 class="text-sm font-semibold text-slate-900 mb-3">${esc(t('manager.inventoryTitle'))}</h3>
            <div class="overflow-x-auto border border-slate-200 rounded-lg">
              <table class="w-full text-left border-collapse">
                <thead class="bg-slate-50 text-[11px] uppercase text-slate-600">
                  <tr><th class="px-3 py-2">${isVi ? 'Loại phòng' : 'Type'}</th><th class="px-3 py-2">${isVi ? 'Tổng' : 'Total'}</th><th class="px-3 py-2">${isVi ? 'Hỏng' : 'OOO'}</th><th class="px-3 py-2">${isVi ? 'Giá niêm yết (₫)' : 'Base Price (₫)'}</th></tr>
                </thead>
                <tbody>${invRows}</tbody>
              </table>
            </div>
            <div class="mt-3 flex justify-end">
              <button type="button" onclick="saveRoomInventory()" class="px-3.5 py-2 rounded-lg text-xs font-medium bg-blue-600 hover:bg-blue-700 text-white">${esc(t('manager.saveInventory'))}</button>
            </div>
          </section>

          <section class="bg-white rounded-xl border border-slate-200 p-4 sm:p-5">
            <h3 class="text-sm font-semibold text-slate-900 mb-3">${esc(t('manager.policyTitle'))}</h3>
            <div class="grid grid-cols-2 gap-3 text-xs">
              <div>
                <label class="block font-medium text-slate-600 mb-1">${isVi ? 'Tỷ lệ overbooking p (%)' : 'Overbooking Rate p (%)'}</label>
                <input id="pol-overbook" type="number" min="0" max="50" value="${p.overbookingRate}" class="w-full rounded-lg border border-slate-300 px-2.5 py-2 text-sm tabular-nums" />
              </div>
              <div>
                <label class="block font-medium text-slate-600 mb-1">${isVi ? 'Giờ giữ phòng không đảm bảo' : 'Non-guaranteed Hold Cutoff'}</label>
                <input id="pol-hold" type="time" value="${esc(p.holdUntilTime)}" class="w-full rounded-lg border border-slate-300 px-2.5 py-2 text-sm tabular-nums" />
              </div>
              <div>
                <label class="block font-medium text-slate-600 mb-1">${isVi ? 'Nhắc khách đoàn (ngày)' : 'Group Reconfirm (days)'}</label>
                <input id="pol-reconf-group" type="number" min="1" value="${p.reconfirmDaysGroup}" class="w-full rounded-lg border border-slate-300 px-2.5 py-2 text-sm tabular-nums" />
              </div>
              <div>
                <label class="block font-medium text-slate-600 mb-1">${isVi ? 'Nhắc khách lẻ (ngày)' : 'Indiv Reconfirm (days)'}</label>
                <input id="pol-reconf-indiv" type="number" min="1" value="${p.reconfirmDaysIndiv}" class="w-full rounded-lg border border-slate-300 px-2.5 py-2 text-sm tabular-nums" />
              </div>
              <div>
                <label class="block font-medium text-slate-600 mb-1">${isVi ? 'Phí hủy có đảm bảo (%)' : 'Guaranteed Cancel Fee (%)'}</label>
                <input id="pol-cancel-fee" type="number" min="0" max="100" value="${p.cancelFeePercent}" class="w-full rounded-lg border border-slate-300 px-2.5 py-2 text-sm tabular-nums" />
              </div>
            </div>
            <div class="mt-4 flex justify-end">
              <button type="button" onclick="savePolicySettings()" class="px-3.5 py-2 rounded-lg text-xs font-medium bg-blue-600 hover:bg-blue-700 text-white">${esc(t('manager.savePolicy'))}</button>
            </div>
          </section>
        </div>

        <!-- SC-02 Concurrency Test & Agent Contracts -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-5">
          <section class="bg-white rounded-xl border border-slate-200 p-4 sm:p-5">
            <h3 class="text-sm font-semibold text-slate-900">${esc(t('manager.sc02Title'))}</h3>
            <p class="text-xs text-slate-500 mt-1">${esc(t('manager.sc02Desc'))}</p>
            <div class="mt-3">
              <button type="button" onclick="runConcurrencyTest50()" ${ui.sc02Running ? 'disabled' : ''} class="px-4 py-2 rounded-lg text-xs sm:text-sm font-medium bg-slate-900 hover:bg-slate-800 text-white">
                ${ui.sc02Running ? '...' : esc(t('manager.btnRunSc02'))}
              </button>
            </div>
            ${scHtml}
          </section>

          <section class="bg-white rounded-xl border border-slate-200 p-4 sm:p-5">
            <h3 class="text-sm font-semibold text-slate-900 mb-3">${esc(t('manager.agentsTitle'))}</h3>
            <div class="space-y-2.5">
              ${state.agents.map(ag => `
                <div class="p-3 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-between gap-3 text-xs">
                  <div>
                    <div class="font-semibold text-slate-900">${esc(ag.name)} · ${esc(ag.contractType)}</div>
                    <div class="text-slate-500 mt-0.5">${esc(ag.roomType)} · ${ag.contractType === 'Allotment' ? `Quota: ${ag.quota}/night` : 'Unlimited'} · Comm: ${ag.commission}%</div>
                  </div>
                  <button type="button" onclick="toggleAgentStatus('${esc(ag.id)}')" class="px-2.5 py-1 rounded font-medium border ${ag.status === 'Active' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-red-50 text-red-700 border-red-200'}">
                    ${esc(ag.status)}
                  </button>
                </div>
              `).join('')}
            </div>
          </section>
        </div>

        <!-- Audit Log (NFR-04) -->
        <section class="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <div class="px-4 py-3 border-b border-slate-200 bg-slate-50 font-semibold text-sm text-slate-900">${esc(t('manager.auditTitle'))}</div>
          <div class="max-h-64 overflow-y-auto divide-y divide-slate-200 text-xs">
            ${state.auditLogs.map(log => `
              <div class="px-4 py-2.5 flex flex-wrap items-center justify-between gap-2">
                <div>
                  <span class="font-mono font-semibold text-blue-700 mr-2">${esc(log.action)}</span>
                  <span class="text-slate-800">${esc(log.detail)}</span>
                </div>
                <div class="text-slate-500 tabular-nums">${esc(log.actor)} · ${esc(log.ts)}</div>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    function render() {
      renderNavigation();
      const root = document.getElementById('app-content');
      if (ui.tab === 'booking') root.innerHTML = renderBookingFlow();
      else if (ui.tab === 'staff') root.innerHTML = renderStaffDesk();
      else if (ui.tab === 'reception') root.innerHTML = renderReceptionView();
      else if (ui.tab === 'manager') root.innerHTML = renderManagerConsole();
    }

    // Initialize default Table 9 Step 2 check on load
    runStep2Check(false);
    render();
  </script>
</body>
</html>
